<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>公開を終了しました</title>
<style>
  :root { --bg: #f5f8fb; --text: #1f2d3a; --sub: #5b6b7a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14191f; --text: #e6edf3; --sub: #9aa8b5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; line-height: 1.8; }
  h1 { font-size: 1.25rem; }
  p { color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>このページの公開は終了しました</h1>
  <p>ご利用ありがとうございました。</p>
</main>
<script>
  // 以前インストールされたオフライン用の仕組み（Service Worker）とキャッシュを片付ける
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { if (!/\/kentee\//.test(r.scope)) r.unregister(); });
    });
  }
  if (window.caches) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { if (/^(kakeibo|nobishiro)-/.test(k)) caches.delete(k); });
    });
  }
</script>
</body>
</html>
